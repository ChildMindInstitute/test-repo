#          if [[ ${{ github.event.pull_request.head.ref }} == 'release/'* ]]; then
#            echo "Branch is valid to deploy a production image. Proceeding ..."
#          else
#            echo "Branch don't match production branch pattern."
#            exit 1
#          fi
